<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-lg border-0">

        <div class="card-body p-4">

          <h1 class="text-center mb-4">
            Mayor o menor
          </h1>

          <div class="d-flex justify-content-center gap-5 mb-4">

            <div class="text-center">

              <h6 class="text-muted mb-1">
                Puntaje
              </h6>

              <h3 class="fw-bold text-primary">
                {{ puntos() }}
              </h3>

            </div>

            <div class="text-center">

              <h6 class="text-muted mb-1">
                Cartas restantes
              </h6>

              <h3 class="fw-bold text-success">
                {{ mazo().length }}
              </h3>

            </div>

          </div>

          <div class="d-flex justify-content-center align-items-center gap-5 mb-5">

            <div class="text-center">

              <h5 class="mb-3 text-muted">
                Carta actual
              </h5>

              @if (cartaActual()) {

                <img
                  [src]="'cartas/' + cartaActual()!.palo + '-' + cartaActual()!.valor + '.png'"
                  alt="Carta actual"
                  class="img-fluid rounded shadow"
                  style="max-width: 180px;"
                >

              }

            </div>

            <div class="text-center position-relative">

              <h5 class="mb-3 text-muted">
                Mazo
              </h5>

              <img
                src="cartas/Back-B.png"
                alt="Mazo"
                class="img-fluid rounded shadow"
                style="max-width: 180px;"
              >

              @if (cartaAnimada()) {

                <img
                  [src]="'cartas/' + cartaAnimada()!.palo + '-' + cartaAnimada()!.valor + '.png'"
                  alt="Carta animada"
                  class="img-fluid rounded shadow position-absolute top-0 start-0"
                  style="max-width: 180px; margin-top: 42px;"
                  [class.mover]="animando()"
                >

              }

            </div>

          </div>

          @if (!gameOver()) {

            <div class="d-flex justify-content-center gap-3 mb-4">

              <button
                class="btn btn-success btn-lg px-4"
                (click)="jugar('mayor')"
                [disabled]="animando()">

                Mayor

              </button>

              <button
                class="btn btn-danger btn-lg px-4"
                (click)="jugar('menor')"
                [disabled]="animando()">

                Menor

              </button>

            </div>

          }

          @if (mensaje()) {

            <div
              class="alert text-center"
              [class.alert-success]="!gameOver()"
              [class.alert-danger]="gameOver()"
            >

              <h4 class="mb-0">
                {{ mensaje() }}
              </h4>

            </div>

          }

          @if (gameOver() && siguienteCarta()) {

            <div class="text-center mb-4">

              <h5 class="mb-3 text-muted">
                La carta era
              </h5>

              <img
                [src]="'cartas/' + siguienteCarta()!.palo + '-' + siguienteCarta()!.valor + '.png'"
                alt="Carta revelada"
                class="img-fluid rounded shadow"
                style="max-width: 180px;"
              >

            </div>

          }

          @if (gameOver()) {

            <div class="text-center">

              <button
                class="btn btn-primary btn-lg px-5"
                (click)="iniciarJuego()">

                Jugar otra vez

              </button>

            </div>

          }

        </div>

      </div>

    </div>

  </div>

</div>
