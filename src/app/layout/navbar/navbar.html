<nav class="navbar navbar-expand-lg grid text-center sticky-top bg-dark-subtle mt-2 rounded-4 border border-secondary shadow-sm">

  <div class="container-fluid navbar-grid">
    <!-- quien soy -->
    <div class="left-col d-flex align-items-center w-100">
      <a routerLink="/who-am-i" class="nav-item">
        <img class="info-btn" src="/info-btn.png">
      </a>
    </div>

    <!-- logo/home -->
    <div class="center-col d-flex align-items-center w-100 justify-content-center">
      <a routerLink="" class="navbar-brand">
        <img class="logo-img" src="/logo.png">
      </a>
    </div>


    <!-- verificacion logueado -->
    @if (userService.currentUser()) {
      <div class="right-col d-flex align-items-center w-100 justify-content-end">

        <div class="dropdown">
          <button
            class="btn btn-primary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
          >
            Hola, {{ userService.currentUser()?.nombre }}!
          </button>

          <ul class="dropdown-menu">
            <li>
              <button
                class="dropdown-item"
                (click)="logout()"
              >
                Cerrar sesión
              </button>
            </li>
          </ul>
        </div>
      </div>
    } @else {
      <!-- botones registro/login -->
       <div class="right-col d-flex align-items-center w-100 justify-content-end d-flex gap-2">
          <a routerLink="/login" type="button" class="btn btn-outline-primary">Login</a>
          <a routerLink="/register" class="btn btn-primary">Register</a>
       </div>
    }
  </div>

</nav>
